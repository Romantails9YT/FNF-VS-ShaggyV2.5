<!-- Auto-redirect helper: if a Story/Download button in the mod mentions "shaggy x matt" or "press to download", clicking it will open the Shaggy x Matt mod in ./mods/ -->
<script>
(function(){
  function shouldRedirectText(t){
    if(!t) return false;
    t = t.toLowerCase();
    return t.includes('shaggy x matt') || t.includes('shaggy x matt') || t.includes('press to download') || (t.includes('download') && t.includes('shaggy'));
  }

  document.addEventListener('click', function(e){
    try{
      var el = e.target;
      while(el && el !== document){
        var txt = (el.textContent || '').trim();
        if(shouldRedirectText(txt)){
          // open Shaggy x Matt mod in a new tab to avoid losing progress
          window.open('./mods/','_blank');
          e.preventDefault();
          return;
        }
        el = el.parentNode;
      }
    }catch(err){/* ignore */}
  }, true);
})();
</script>
